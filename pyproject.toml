[project]
name = "timenet-3w"
version = "0.1.0"
description = "Explainable early warning of oil-well events with OpenTSLM and TimeNet"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "timenet",
    "xgboost>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
timenet = { git = "https://github.com/OpenTSLM/TimeNet", subdirectory = "packages/timenet", rev = "7ad336b394b287e09990654e8e78f38e7530d8a7" }
